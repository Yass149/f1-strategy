[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "race-engineer-ai"
version = "0.1.0"
description = "Explainable F1 race strategy and telemetry intelligence."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
]
data = [
  "fastf1>=3.5,<4",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pyarrow>=16,<22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = ["UP007"]
